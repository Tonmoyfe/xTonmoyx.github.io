<style>
:root{--bg:#f5f6fb;--surface:#fff;--surface2:#eceefa;--text:#161a33;--muted:#5d6486;--line:#dfe2f2;--blurple:#5865f2;--shadow:0 8px 24px rgba(22,26,51,.08);
--hd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--bd:'DM Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162b;--surface:#1a2040;--surface2:#232a52;--text:#eef0ff;--muted:#a3a9d1;--line:#2d3566;--shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#12162b;--surface:#1a2040;--surface2:#232a52;--text:#eef0ff;--muted:#a3a9d1;--line:#2d3566;--shadow:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--bd);line-height:1.55}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blurple);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.3rem var(--hd)}
.logo img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;padding:8px 13px;border-radius:8px;font-weight:500;color:var(--muted)}
nav button:hover,nav button.on{background:var(--surface2);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:0;font-weight:700;background:var(--blurple);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:var(--surface2);color:var(--text)}.btn.danger{background:#d6453d}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
@media(max-width:900px){nav{display:none}.bar{justify-content:space-between}.hide-s{display:none}}
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line)}
.mnav button{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.mnav button.on{background:var(--text);color:var(--bg)}
@media(max-width:900px){.mnav{display:flex}}
.hero{padding:72px 0 40px}
.hero h1{font:800 clamp(2.3rem,6vw,4.2rem)/1.04 var(--hd);letter-spacing:-.03em;max-width:15ch}
.hero p{margin:18px 0 28px;color:var(--muted);font-size:1.1rem;max-width:52ch}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);max-width:680px}
.search:focus-within{border-color:var(--blurple)}
.search input{flex:1;border:0;background:none;color:var(--text);font:500 1.05rem var(--bd);padding:10px 0;min-width:0}
.search input:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;color:var(--muted)}
.chip:hover{border-color:var(--blurple);color:var(--text)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:34px 0 18px}
select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
h2{font:800 1.5rem var(--hd);letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:50px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.thumb{height:150px;display:grid;place-items:center;font-size:3.2rem;background-size:cover;background-position:center}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:700 1.05rem var(--hd)}.card .meta{font-size:.85rem;color:var(--muted)}
.card .desc{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
footer .links{display:flex;gap:16px}footer a:hover{color:var(--text)}
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px);max-height:92vh;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,10,25,.6)}
.m-body{padding:22px}.m-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.x{width:36px;height:36px;border-radius:9px;border:0;background:var(--surface2);font-size:1.1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.tag{padding:4px 12px;border-radius:99px;background:var(--surface2);font-size:.85rem}
label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 4px}
.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea.f{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
details{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}summary{cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%)}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}

const CONFIG = {

async function hashPw(u,p){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(u+":"+p));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const CATS = [["all","Home"],["Add-on","Add-ons"],["Texture","Textures"],["Map","Maps"],["Skin","Skins"],["Skin Pack","Skin Packs"],["Data Pack","Data Packs"]];

const DEFAULT_ITEMS = [
 {id:1,title:"xTonmoyx Skin Pack",category:"Skin Pack",version:"All",size:"ZIP",date:"2026-11-19",
  desc:"Skin pack download for Minecraft Bedrock. Open the file on your phone or PC to import it.",
  link:"https://www.mediafire.com/file/jctzljfgh3c2c6i/skin+pack.zip/file",image:"",video:"",emoji:"🧑‍🎤"}
];

const $ = s=>document.querySelector(s);
const toast = m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImg=u=>/^(https?:\/\/|\/|data:image\/(png|jpe?g|webp);base64,)/i.test(u||"")?u:"";
const today=()=>new Date().toISOString().slice(0,10);
const safeUrl = u=>/^(https?:\/\/|#|\/)/i.test(u||"")?u:"#";
const ytId=u=>{const m=String(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:""};
const GRADS={"Add-on":["#5865f2","#8a63f5"],"Texture":["#12a37f","#4fd1a5"],"Map":["#e07a3f","#f3b562"],"Skin":["#d6459a","#f08bc0"],"Skin Pack":["#7b3fe4","#e0509c"],"Data Pack":["#2f80ed","#56ccf2"]};
const ICON={"Add-on":"🧩","Texture":"🎨","Map":"🗺️","Skin":"🧑","Skin Pack":"🎭","Data Pack":"📦"};
let items=[], state={cat:"all",q:"",sort:"new"};
const me=()=>{try{const x=JSON.parse(localStorage.getItem("xt_sess")||"null");if(x&&(!x.exp||x.exp>=today()))return x}catch(e){}return localStorage.getItem("xt_auth")==="1"?{u:CONFIG.adminUser,role:"owner"}:null};
let users=[];
const gh=()=>{try{return JSON.parse(localStorage.getItem("xt_gh")||"{}")}catch(e){return{}}};

async function jget(f){try{const r=await fetch(f+"?"+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j))return j}}catch(e){}return null}
async function load(){
  items=(await jget("items.json"))||DEFAULT_ITEMS;
  const u=await jget("users.json");
  if(u){users=u;const m=me();if(m&&m.role!=="owner"&&!users.some(x=>x.u===m.u&&x.h===m.h))localStorage.removeItem("xt_sess")}
  render();renderExtra();
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  return items.filter(i=>(state.cat==="all"||i.category===state.cat)&&(!q||(i.title+" "+i.category+" "+i.desc+" "+i.version).toLowerCase().includes(q)))
   .sort((a,b)=>state.sort==="az"?a.title.localeCompare(b.title):(b.date||"").localeCompare(a.date||"")||b.id-a.id);
}
function render(){
  const list=filtered(), name=(CATS.find(c=>c[0]===state.cat)||[])[1];
  $("#title").textContent=state.q?`Results for “${state.q}”`:(state.cat==="all"?"Latest uploads":name);
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty"><h3>Nothing found</h3><p>Try a different word, or pick another category.</p></div>`;
  const nav=CATS.map(c=>`<button data-cat="${c[0]}" class="${state.cat===c[0]?"on":""}">${c[1]}</button>`).join("")+`<button data-go="projects">Projects</button><button data-go="support">Support</button>`;

}
function thumb(i){
  const g=GRADS[i.category]||["#5865f2","#8a63f5"];
  const bg=i.image?`background-image:url('${esc(safeImg(i.image))}')`:`background-image:linear-gradient(135deg,${g[0]},${g[1]})`;
  return `<div class="thumb" style="${bg}">${i.image?"":esc(i.emoji||ICON[i.category]||"📦")}</div>`;
}
function card(i){return `<button class="card rv" data-id="${i.id}">${thumb(i)}<div class="in"><h3>${esc(i.title)}</h3><div class="meta">${esc(i.category)} · ${esc(i.version)} · ${esc(i.size)}</div><div class="desc">${esc(i.desc)}</div></div></button>`}

   <a class="report" href="${CONFIG.discord}" target="_blank" rel="noopener">Link not working? Report it on Discord</a>`;
  $("#dlg").showModal();
}
function startDownload(btn){
  const url=btn.dataset.url,done=()=>{btn.outerHTML=`<a class="btn" href="${url}" target="_blank" rel="noopener">Download now ✔</a>`};
  let s=me()?0:(CONFIG.waitSeconds|0);if(s<=0)return done();
  btn.disabled=true;btn.textContent=`Download starts in ${s}s`;
  const t=setInterval(()=>{s--;if(s>0)btn.textContent=`Download starts in ${s}s`;else{clearInterval(t);done()}},1000);

  const go=async()=>{
    const raw=$("#l_u").value.trim(),pw=$("#l_p").value,lu=raw.toLowerCase();
    if(raw===CONFIG.adminUser&&await hashPw(raw,pw)===CONFIG.adminHash){localStorage.setItem("xt_sess",JSON.stringify({u:raw,role:"owner"}));render();openAdmin();return toast("Welcome back, owner")}
    const u=await jget("users.json");if(u)users=u;
    const x=users.find(v=>v.u===lu);
    if(x&&x.exp>=today()&&await hashPw(lu,x.salt+pw.trim())===x.h){localStorage.setItem("xt_sess",JSON.stringify({u:lu,role:x.role,perms:x.perms||[],exp:x.exp,h:x.h}));render();x.role==="helper"?openAdmin():(openAcct(),toast("VIP active ✔"));return}
    toast("Wrong username/token, or it expired")};
  $("#l_go").onclick=go;$("#l_p").onkeydown=e=>{if(e.key==="Enter")go()};
  show();
}

/* ===== PUBLISH TO GITHUB (commits items.json, Netlify redeploys) ===== */
async function publishFile(name,data){
  const s=gh();if(!s.repo||!s.token)throw new Error("Save your GitHub settings first");
  const url=`https://api.github.com/repos/${s.repo}/contents/${name}`,br=s.branch||"main";
  const H={Authorization:"Bearer "+s.token,Accept:"application/vnd.github+json"};
  let sha;const g=await fetch(`${url}?ref=${br}`,{headers:H});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error("GitHub error "+g.status+" (check repo/token)");
  const body={message:"Update downloads",branch:br,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))};
  if(sha)body.sha=sha;
  const p=await fetch(url,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!p.ok)throw new Error("Publish failed: "+p.status);
}
async function safePublish(n="items.json",d=items){
  try{toast("Publishing…");await publishFile(n,d);toast("Published! Live in about a minute.")}
  catch(e){toast(e.message)}
}

let editId=null,pic="";
const img2data=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function openAdmin(tab="up"){
  const m=me();if(!m)return openLogin();
  const own=m.role==="owner",can=p=>own||(m.perms||[]).includes(p),s=gh();
  const H=`<div class="m-head"><h2>${own?"Owner panel":"Helper panel"}</h2><button class="x" data-close aria-label="Close">✕</button></div><div class="row" style="margin:0 0 6px"><button class="chip" data-tab="up">Uploads</button>${own?`<button class="chip" data-tab="mem">Members</button>`:""}</div>`;
  const out=`<div style="margin-top:16px"><button class="btn alt" id="a_out">Log out</button></div>`;
  $("#admBody").onclick=e=>{const t=e.target.closest("[data-tab]");if(t){editId=null;pic="";openAdmin(t.dataset.tab)}};
  if(tab==="mem"&&own){
    $("#admBody").innerHTML=H+`<p class="note" style="margin:6px 0">Create a login for a VIP or helper after they pay. The token is shown once. Copy it and send it to them.</p>
     <div class="two"><div><label>Username</label><input class="f" id="m_u"></div><div><label>Type</label><select class="f" id="m_r"><option value="vip">VIP</option><option value="helper">Helper</option></select></div></div>
     <div class="two"><div><label>Months valid</label><input class="f" id="m_mo" type="number" min="1" value="1"></div><div><label>Helper can</label><div class="row" style="margin:6px 0 0"><label style="margin:0"><input type="checkbox" class="m_p" value="add" checked> add</label><label style="margin:0"><input type="checkbox" class="m_p" value="edit"> edit</label><label style="margin:0"><input type="checkbox" class="m_p" value="delete"> delete</label></div></div></div>
     <div style="margin-top:14px"><button class="btn" id="m_add">Create & publish</button></div><div id="m_out"></div>
     <h2 style="font-size:1.1rem;margin-top:18px">Members</h2><div id="m_list"></div>`+out;
    const list=()=>{$("#m_list").innerHTML=users.length?users.map(x=>`<div class="admin-item"><span>${esc(x.u)} <small style="color:var(--muted)">${esc(x.role)} · until ${esc(x.exp)}</small></span><span><button class="x" data-ext="${esc(x.u)}" title="+1 month">+1</button> <button class="x" data-rm="${esc(x.u)}" aria-label="Remove">🗑</button></span></div>`).join(""):`<p class="note">No members yet.</p>`};
    list();
    const addMo=(d,n)=>{const t=new Date(d>today()?d:today());t.setMonth(t.getMonth()+n);return t.toISOString().slice(0,10)};
    $("#m_add").onclick=async()=>{
      const u=$("#m_u").value.trim().toLowerCase();
      if(!/^[a-z0-9_.-]{3,20}$/.test(u))return toast("Username: 3-20 letters or numbers");
      if(u===CONFIG.adminUser.toLowerCase()||users.some(x=>x.u===u))return toast("Username already used");
      const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))],tok=rnd(16).map(b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join(""),salt=rnd(6).map(b=>b.toString(16).padStart(2,"0")).join("");
      const role=$("#m_r").value;
      users.push({u,role,salt,h:await hashPw(u,salt+tok),exp:addMo(today(),Math.max(1,+$("#m_mo").value||1)),perms:role==="helper"?[...document.querySelectorAll(".m_p:checked")].map(c=>c.value):[]});
      list();$("#m_out").innerHTML=`<p class="note" style="user-select:all"><b>Username:</b> ${esc(u)}<br><b>Token:</b> ${tok}</p><p class="note">Save this now. It cannot be shown again.</p>`;
      await safePublish("users.json",users)};
    $("#m_list").onclick=async e=>{
      const x=e.target.closest("[data-ext]"),r=e.target.closest("[data-rm]");
      if(x){const u=users.find(v=>v.u===x.dataset.ext);u.exp=addMo(u.exp,1);list();await safePublish("users.json",users)}
      if(r&&confirm("Remove this member?")){users=users.filter(v=>v.u!==r.dataset.rm);list();await safePublish("users.json",users)}};
  }else{
    $("#admBody").innerHTML=H+`<h3 style="margin:10px 0 0">${"Add or edit a download"}</h3>
     <label>Title</label><input class="f" id="a_title">
     <div class="two"><div><label>Category</label><select class="f" id="a_cat">${CATS.slice(1).map(c=>`<option value="${c[0]}">${c[0]}</option>`).join("")}</select></div>
     <div><label>Version</label><input class="f" id="a_ver" placeholder="1.21+"></div></div>
     <div class="two"><div><label>File size</label><input class="f" id="a_size" placeholder="12 MB"></div><div><label>Cover photo (upload)</label><input class="f" id="a_file" type="file" accept="image/*"></div></div>
     <label>…or cover image link</label><input class="f" id="a_img" placeholder="https://…">
     <label>YouTube video link (optional)</label><input class="f" id="a_vid" placeholder="https://youtube.com/watch?v=…">
     <label>Download link (Mediafire, Mega, Drive…)</label><input class="f" id="a_link" placeholder="https://">
     <label>Description</label><textarea class="f" id="a_desc"></textarea>
     <div style="margin-top:16px"><button class="btn" id="a_add">Add & publish</button></div>
     <details ${s.repo&&s.token?"":"open"}><summary>GitHub publish settings</summary>
      <p class="note">One-time setup. Stored only in this browser. The token needs “Contents: Read and write” on your website repo.</p>
      <label>Repo (username/repo)</label><input class="f" id="g_repo" value="${esc(s.repo||"")}" placeholder="yourname/your-repo">
      <div class="two"><div><label>Branch</label><input class="f" id="g_br" value="${esc(s.branch||"main")}"></div><div><label>Token</label><input class="f" id="g_tk" type="password" value="${esc(s.token||"")}" placeholder="github_pat_…"></div></div>
      <div style="margin-top:12px"><button class="btn alt" id="g_save">Save settings</button></div></details>
     <h2 style="font-size:1.1rem;margin-top:18px">Your items</h2><div id="a_list"></div>`+out;
    const list=()=>{$("#a_list").innerHTML=items.map(i=>`<div class="admin-item"><span>${esc(i.title)} <small style="color:var(--muted)">(${esc(i.category)})</small></span><span>${can("edit")?`<button class="x" data-edit="${i.id}" aria-label="Edit">✏️</button> `:""}${can("delete")?`<button class="x" data-del="${i.id}" aria-label="Delete">🗑</button>`:""}</span></div>`).join("")};
    list();
    $("#g_save").onclick=()=>{localStorage.setItem("xt_gh",JSON.stringify({repo:$("#g_repo").value.trim(),branch:$("#g_br").value.trim()||"main",token:$("#g_tk").value.trim()}));toast("Settings saved")};
    $("#a_file").onchange=async e=>{try{pic=await img2data(e.target.files[0]);toast("Photo added ✔")}catch(x){toast("Could not read that image")}};
    $("#a_img").oninput=()=>pic="";
    $("#a_add").onclick=async()=>{
      const title=$("#a_title").value.trim(),link=$("#a_link").value.trim();
      if(!title||!link)return toast("Enter a title and a download link");
      if(editId?!can("edit"):!can("add"))return toast("You don't have permission for this");
      const o={title,category:$("#a_cat").value,version:$("#a_ver").value||"All",size:$("#a_size").value||"-",desc:$("#a_desc").value,link,image:pic||$("#a_img").value.trim(),video:$("#a_vid").value.trim()};
      if(editId)items=items.map(x=>x.id==editId?{...x,...o}:x);else items.unshift({id:Date.now(),date:today(),...o});
      editId=null;pic="";render();list();["a_title","a_ver","a_size","a_link","a_img","a_vid","a_desc","a_file"].forEach(k=>$("#"+k).value="");$("#a_add").textContent="Add & publish";
      await safePublish()};
    $("#a_list").onclick=async e=>{
      const d=e.target.closest("[data-del]"),ed=e.target.closest("[data-edit]");
      if(d&&confirm("Delete this download?")){items=items.filter(x=>x.id!=d.dataset.del);render();list();await safePublish()}
      if(ed){const i=items.find(x=>x.id==ed.dataset.edit);editId=i.id;pic=i.image||"";
        [["a_title","title"],["a_ver","version"],["a_size","size"],["a_link","link"],["a_vid","video"],["a_desc","desc"]].forEach(([k,f])=>$("#"+k).value=i[f]||"");
        $("#a_cat").value=i.category;$("#a_img").value=pic.startsWith("data:")?"":pic;$("#a_add").textContent="Save changes";$("#a_title").scrollIntoView({behavior:"smooth"})}};
  }
  $("#a_out").onclick=logout;show();
}

const PROJECTS=[
 {n:"LAF Bot",d:"All-in-one Discord bot with a special economy system.",live:1},
 {n:"LAF Network",d:"Our Minecraft server."},
 {n:"Gorilla Optimizer",d:"A performance optimizer."},
 {n:"LAF Client",d:"Our own Minecraft client."}];
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08}):null;
function reveal(){document.querySelectorAll(".rv:not(.in)").forEach(el=>io?io.observe(el):el.classList.add("in"))}
function renderExtra(){
  $("#projects").innerHTML=`<h2>Projects</h2><p class="note" style="margin:0">What we are building. VIP members get early access to everything marked coming soon.</p><div class="pgrid">`+PROJECTS.map(p=>`<div class="proj rv"><div class="pic">${p.live?`<img src="${LAFICON}" alt="">`:"?"}</div><div class="ph"><h3>${p.n}</h3><span class="badge ${p.live?"live":""}">${p.live?"Available":"Coming soon"}</span></div><p class="desc" style="-webkit-line-clamp:unset">${p.d}</p>${p.live?`<a class="btn" href="${esc(CONFIG.botInvite)}" target="_blank" rel="noopener">Invite to your server</a>`:`<span class="note" style="margin:0">⭐ VIP early access</span>`}</div>`).join("")+`</div>`;
  $("#support").innerHTML=`<div class="pgrid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="proj rv"><h2>Support us 💜</h2><p class="desc" style="-webkit-line-clamp:unset">Want to donate and help us keep building? Donations are done through our Discord server, so you need to be in the server to donate. Your small act of kindness means a lot to us.</p><div><a class="btn" href="${CONFIG.discord}" target="_blank" rel="noopener">Join Discord to donate</a></div></div><div class="proj rv"><h2>⭐ VIP · $0.50 / month</h2><p class="desc" style="-webkit-line-clamp:unset">Without VIP, every download has a ${CONFIG.waitSeconds}-second wait. VIP skips it, plus you get early access to our upcoming projects and a custom role in our Discord server. Buy it in our Discord server.</p><div><a class="btn alt" href="${CONFIG.discord}" target="_blank" rel="noopener">Get VIP</a></div></div></div>`;
  reveal();
}

/* ===== EVENTS ===== */
const setCat=c=>{state.cat=c;render();$("#list").scrollIntoView({behavior:"smooth"})};
$("#authBtn").onclick=()=>{const m=me();m?(m.role==="vip"?openAcct():openAdmin()):openLogin()};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)document.getElementById(g.dataset.go).scrollIntoView({behavior:"smooth"})});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")$("#list").scrollIntoView({behavior:"smooth"})});
$("#go").onclick=()=>{state.q=$("#q").value;render();$("#list").scrollIntoView({behavior:"smooth"})};
["#nav","#mnav","#chips"].forEach(s=>$(s).addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b)setCat(b.dataset.cat)}));
$("#sort").onchange=e=>{state.sort=e.target.value;render()};
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openItem(c.dataset.id)});
document.addEventListener("click",e=>{const d=e.target.closest("#dlBtn");if(d)startDownload(d)});
document.addEventListener("click",e=>{if(e.target.closest("[data-close]"))e.target.closest("dialog").close();if(e.target.tagName==="DIALOG")e.target.close()});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
$("#dlg").addEventListener("close",()=>{$("#dlgBody").innerHTML=""});
$("#yr").textContent=new Date().getFullYear();
load();
</script>
